version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      # @tailwindcss/vite depends on an exact tailwindcss version, and the vite
      # peer ranges of @sveltejs/vite-plugin-svelte, vitest and
      # @tailwindcss/vite all stop at vite 8, so a vite 9 cannot install on
      # its own. Upgrade the Vite toolchain in one PR.
      vite-toolchain:
        patterns:
          - vite
          - vitest
          - '@sveltejs/vite-plugin-svelte'
          - '@tailwindcss/vite'
          - tailwindcss
    ignore:
      # Tracks the Node.js version bundled with Electron, so majors move by hand
      # with Electron upgrades.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # maplibre-gl 6.19.0 replaced the camera's Transform classes with a
      # store, and svelte-maplibre-gl 2.2.1 still reads the camera's
      # transform on every move, so the map breaks on pan and zoom. Lift
      # this once a svelte-maplibre-gl release supports 6.19.
      - dependency-name: 'maplibre-gl'
        versions:
          - '>=6.19.0'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
