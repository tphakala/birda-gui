name: Checks

# Shared validation run by ci.yml and release.yml, so a release tag goes
# through the same checks as a pull request.
on:
  workflow_call:
    inputs:
      build:
        description: 'Also run npm run build'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate translations
        run: npm run validate:translations

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Unused dependencies & exports
        run: npm run knip

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Build
        if: inputs.build
        run: npm run build
