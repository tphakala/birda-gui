name: Release

on:
  push:
    tags:
      - 'v*'
  # Run manually on a v* tag ref to redo a release; a branch ref is refused.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      # Each platform job in `build` runs the build itself.
      build: false

  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The packages are named from package.json, so the tag must match it.
      # The release is created for the ref name, so only a v* tag ref is
      # accepted; a branch, even one named like a tag, is refused.
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Releases run from a v* tag ref, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Release version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.platform }})
    needs: [checks, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            dist-flag: --linux
          - platform: windows
            os: windows-latest
            dist-flag: --win
          - platform: macos
            os: macos-latest
            dist-flag: --mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Setup macOS code signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || github.run_id }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Set as default keychain
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Clean up certificate file
          rm "$CERTIFICATE_PATH"

      - name: Build
        run: npm run build

      # The release job publishes. On a CI tag build electron-builder publishes
      # by default (to the repository package.json names), and without a token
      # that would fail the job.
      - name: Package
        run: npx electron-builder ${{ matrix.dist-flag }} --publish never
        env:
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}

      - name: Cleanup macOS keychain
        if: matrix.platform == 'macos' && always()
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || github.run_id }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.gh-release.outputs.id }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List release artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Create GitHub Release
        id: gh-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Birda GUI v${{ needs.validate.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
          body: |
            ## Installation

            | Platform | File | Type |
            |----------|------|------|
            | Windows | `Birda-GUI-Setup-${{ needs.validate.outputs.version }}-windows-x64.exe` | Installer |
            | Windows | `Birda-GUI-${{ needs.validate.outputs.version }}-windows-x64.exe` | Portable |
            | Linux | `Birda-GUI-${{ needs.validate.outputs.version }}-linux-x86_64.AppImage` | AppImage |
            | Linux | `Birda-GUI-${{ needs.validate.outputs.version }}-linux-amd64.deb` | Debian package |
            | macOS | `Birda-GUI-${{ needs.validate.outputs.version }}-macos-arm64.dmg` | Disk image (Apple silicon) |

            The birda CLI is bundled with all release builds. No separate installation required.

  scan:
    needs: release
    permissions:
      # The scan appends its results to the release notes.
      contents: write
    uses: ./.github/workflows/virustotal.yml
    with:
      release_id: ${{ needs.release.outputs.release-id }}
    secrets:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
