name: Update Third-Party Licenses

on:
  push:
    branches: [main]
    paths:
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To start CI on the pull request branch (see the last step).
  actions: write

jobs:
  update-licenses:
    name: Update Licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # Pinned for reproducible output. The tool is not in package.json, so
      # Dependabot does not update it; bump the version here by hand.
      - name: Generate third-party license file
        run: npx --yes generate-license-file@4.2.5 --input package.json --output THIRD_PARTY_LICENSES.txt --overwrite

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet THIRD_PARTY_LICENSES.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: update third-party licenses'
          title: 'chore: update third-party licenses'
          body: |
            This PR updates the THIRD_PARTY_LICENSES.txt file with the latest license information from npm dependencies.

            Auto-generated by the licenses workflow.
          branch: chore/update-licenses
          delete-branch: true
          labels: dependencies

      # GitHub starts no workflow run for a push or pull request made with
      # GITHUB_TOKEN, but it does run a workflow_dispatch, so start CI on the
      # pull request branch explicitly.
      - name: Run CI on the pull request branch
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref chore/update-licenses
