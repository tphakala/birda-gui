name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the licenses workflow run CI on the branch of the pull request it opens.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/checks.yml
