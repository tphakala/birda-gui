version: '3'

vars:
  OUT_DIR: out
  RELEASE_DIR: release

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # === Development ===

  dev:
    desc: Start dev server (renderer HMR + Electron, restart on main/preload change)
    cmds:
      - npm run dev

  # === Building ===

  fetch-cli:
    desc: Download birda CLI embeddable artifact for current platform
    cmds:
      - npx tsx scripts/fetch-birda-cli.ts

  build:
    desc: Build all targets (main + preload + renderer); npm's prebuild hook fetches the birda CLI
    cmds:
      - npm run build

  # === Linting & Type Checking ===

  check:
    desc: Run svelte-check for type errors and warnings
    cmds:
      - npm run check

  eslint:
    desc: Run ESLint (same files as the ESLint step of npm run lint)
    cmds:
      - npm run paraglide
      - npx eslint .

  lint:
    desc: Run all lint and type checks (ESLint + svelte-check, and tsc)
    # npm run lint compiles Paraglide once, then runs ESLint and svelte-check
    # in turn; separate eslint and check tasks in parallel would start two
    # compiles that write the same files. typecheck:main reads no Paraglide
    # output, so it runs alongside.
    deps:
      - lint:npm
      - typecheck:main

  lint:npm:
    internal: true
    cmds:
      - npm run lint

  lint:fix:
    desc: Run ESLint with auto-fix
    cmds:
      - npm run lint:fix

  typecheck:main:
    desc: Type check main, preload, shared, scripts and build configs (tsconfig.node.json)
    cmds:
      - npm run typecheck

  # === Formatting ===

  format:
    desc: Format all files with Prettier
    cmds:
      - npm run format

  format:check:
    desc: Check formatting (CI-friendly)
    cmds:
      - npm run format:check

  # === Packaging ===

  pack:
    desc: Build and package (unpacked, for testing)
    cmds:
      - npm run pack

  dist:
    desc: Build and create distributable for current platform
    cmds:
      - npm run dist

  dist:linux:
    desc: Build and package for Linux (AppImage + deb)
    cmds:
      - npm run dist:linux

  dist:win:
    desc: Build and package for Windows (NSIS + portable)
    cmds:
      - npm run dist:win

  dist:mac:
    desc: Build and package for macOS (dmg)
    cmds:
      - npm run dist:mac

  # === Utilities ===

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.OUT_DIR}} {{.RELEASE_DIR}}

  clean:all:
    desc: Remove build artifacts and node_modules
    cmds:
      - rm -rf {{.OUT_DIR}} {{.RELEASE_DIR}} node_modules

  install:
    desc: Install dependencies
    cmds:
      - npm install
